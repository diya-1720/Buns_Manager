<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="neoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#111827" />
    </filter>
  </defs>

  <!-- Neo-Brutalist Paper Badge Background -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="#FEF08A" stroke="#111827" stroke-width="16" filter="url(#neoShadow)" />
  
  <!-- Subtle Graph Paper Accent Grid -->
  <path d="M24 140 H488 M24 256 H488 M24 372 H488 M140 24 V488 M256 24 V488 M372 24 V488" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" opacity="0.45" />

  <!-- Left Ear -->
  <path d="M165 240 C145 125, 155 60, 192 55 C228 50, 222 135, 205 240 Z" fill="#FAF8F5" stroke="#111827" stroke-width="14" stroke-linejoin="round" />
  <!-- Left Inner Ear -->
  <path d="M176 220 C164 135, 172 88, 192 84 C212 80, 208 140, 196 220 Z" fill="#FBCFE8" stroke="#F472B6" stroke-width="6" stroke-linejoin="round" />

  <!-- Right Ear -->
  <path d="M307 240 C290 135, 284 50, 320 55 C357 60, 367 125, 347 240 Z" fill="#FAF8F5" stroke="#111827" stroke-width="14" stroke-linejoin="round" />
  <!-- Right Inner Ear -->
  <path d="M316 220 C304 140, 300 80, 320 84 C340 88, 348 135, 336 220 Z" fill="#FBCFE8" stroke="#F472B6" stroke-width="6" stroke-linejoin="round" />

  <!-- Bunny Head Face -->
  <ellipse cx="256" cy="315" rx="142" ry="125" fill="#FAF8F5" stroke="#111827" stroke-width="14" />

  <!-- Forehead Hair Tuft -->
  <path d="M244 206 C250 186, 258 186, 260 200 C264 188, 272 190, 272 208" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cheeks Blush -->
  <ellipse cx="172" cy="348" rx="24" ry="15" fill="#FBCFE8" opacity="0.9" />
  <ellipse cx="340" cy="348" rx="24" ry="15" fill="#FBCFE8" opacity="0.9" />

  <!-- Left Eye -->
  <ellipse cx="200" cy="300" rx="15" ry="19" fill="#111827" />
  <circle cx="195" cy="294" r="6" fill="#FFFFFF" />
  <circle cx="206" cy="306" r="3" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="312" cy="300" rx="15" ry="19" fill="#111827" />
  <circle cx="307" cy="294" r="6" fill="#FFFFFF" />
  <circle cx="318" cy="306" r="3" fill="#FFFFFF" />

  <!-- Cute Nose -->
  <path d="M246 328 Q256 322 266 328 Q256 342 246 328 Z" fill="#F472B6" stroke="#111827" stroke-width="4" stroke-linejoin="round" />

  <!-- Cute Mouth -->
  <path d="M234 345 Q245 358 256 347 Q267 358 278 345" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" />

  <!-- Whiskers Left -->
  <line x1="110" y1="324" x2="154" y2="332" stroke="#111827" stroke-width="7" stroke-linecap="round" />
  <line x1="104" y1="348" x2="150" y2="348" stroke="#111827" stroke-width="7" stroke-linecap="round" />
  <line x1="114" y1="372" x2="156" y2="364" stroke="#111827" stroke-width="7" stroke-linecap="round" />

  <!-- Whiskers Right -->
  <line x1="402" y1="324" x2="358" y2="332" stroke="#111827" stroke-width="7" stroke-linecap="round" />
  <line x1="408" y1="348" x2="362" y2="348" stroke="#111827" stroke-width="7" stroke-linecap="round" />
  <line x1="398" y1="372" x2="356" y2="364" stroke="#111827" stroke-width="7" stroke-linecap="round" />
</svg>
