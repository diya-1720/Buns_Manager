  <!-- Mouth -->
  <path d="M29 44 Q30.5 45.8 32 44.5 Q33.5 45.8 35 44" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" />

  <!-- Whiskers -->
