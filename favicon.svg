  <line x1="12" y1="44" x2="17" y2="44" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="52" y1="41" x2="47" y2="42" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
  <line x1="52" y1="44" x2="47" y2="44" stroke="#111827" stroke-width="1.4" stroke-linecap="round" />
